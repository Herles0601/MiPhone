<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mi Phone HN - Los mejores smartphones nuevos y seminuevos.">
    <meta property="og:title" content="Mi Phone HN | Tienda de Teléfonos">
    <meta property="og:description" content="Encuentra tu próximo smartphone al mejor precio.">
    <meta property="og:type" content="website">
    <title>Mi Phone HN</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1><i class="fa-solid fa-mobile-screen"></i> Mi Phone HN</h1>
            <div class="header-actions">
                <button id="theme-toggle" aria-label="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
                <button id="cart-btn" aria-label="Ver carrito">
                    <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="filters">
            <input type="text" id="search-input" placeholder="Buscar por marca o modelo...">
            <select id="condition-filter">
                <option value="all">Todas las condiciones</option>
                <option value="Nuevo">Nuevos</option>
                <option value="Seminuevo">Seminuevos</option>
            </select>
        </section>

        <section id="product-grid" class="product-grid">
            <!-- Los productos se inyectarán aquí con JavaScript -->
        </section>
    </main>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Tu Carrito</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>Total: <span id="cart-total-price">L 0.00</span></h3>
            </div>
            <div class="checkout-form">
                <input type="text" id="client-name" placeholder="Tu Nombre Completo" required>
                <input type="text" id="client-dni" placeholder="DNI (Opcional)">
                <textarea id="client-address" placeholder="Dirección de entrega" required></textarea>
                <button id="checkout-btn" class="btn-primary"><i class="fa-brands fa-whatsapp"></i> Pedir por WhatsApp</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
